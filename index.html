<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkPie - 你的智能记忆助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      color: #333;
      line-height: 1.6;
      background: #fafafa;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
    header {
      padding: 20px 0;
      border-bottom: 1px solid #eee;
      background: #fff;
    }
    header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-size: 24px; font-weight: 700; color: #333; }
    .logo span { color: #007aff; }
    .nav a {
      margin-left: 24px;
      text-decoration: none;
      color: #666;
      font-size: 15px;
    }
    .nav a:hover { color: #007aff; }
    .hero {
      text-align: center;
      padding: 80px 0 60px;
      background: linear-gradient(180deg, #fff 0%, #f5f5f7 100%);
    }
    .hero h1 {
      font-size: 42px;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 16px;
    }
    .hero p {
      font-size: 18px;
      color: #86868b;
      max-width: 600px;
      margin: 0 auto 32px;
    }
    .hero .app-store-btn {
      display: inline-block;
      background: #007aff;
      color: #fff;
      padding: 12px 36px;
      border-radius: 24px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .hero .app-store-btn:hover { background: #0056cc; }
    .screenshots {
      padding: 60px 0;
      background: #fff;
    }
    .screenshots h2 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 40px;
      color: #1d1d1f;
    }
    .screenshot-grid {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .screenshot-item {
      width: 260px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      background: #f0f0f0;
    }
    .screenshot-item .placeholder {
      aspect-ratio: 9/19;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
      background: #f5f5f5;
    }
    .screenshot-item img { width: 100%; display: block; }
    .features {
      padding: 60px 0;
      background: #fafafa;
    }
    .features h2 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 48px;
      color: #1d1d1f;
    }
    .feature-list {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
    }
    .feature-item {
      flex: 1 1 260px;
      max-width: 300px;
      text-align: center;
      padding: 24px;
    }
    .feature-item .icon { font-size: 36px; margin-bottom: 12px; }
    .feature-item h3 { font-size: 18px; margin-bottom: 8px; color: #1d1d1f; }
    .feature-item p { font-size: 14px; color: #86868b; }
    footer {
      border-top: 1px solid #eee;
      padding: 32px 0;
      text-align: center;
      background: #fff;
    }
    footer p { color: #86868b; font-size: 13px; }
    footer a { color: #666; text-decoration: none; margin: 0 12px; font-size: 13px; }
    footer a:hover { color: #007aff; }
    @media (max-width: 640px) {
      .hero h1 { font-size: 32px; }
      .hero p { font-size: 16px; }
      .screenshot-item { width: 200px; }
    }
  </style>
</head>
<body>
<header>
  <div class="container">
    <div class="logo">Mark<span>Pie</span></div>
    <div class="nav">
      <a href="/">首页</a>
      <a href="/privacy">隐私政策</a>
      <a href="/terms">服务条款</a>
    </div>
  </div>
</header>
<section class="hero">
  <div class="container">
    <h1>MarkPie</h1>
    <p>一款轻量、高效的智能笔记工具。用 MarkPie 记录灵感、整理知识，让信息管理变得简单自然。</p>
    <a href="#" class="app-store-btn" onclick="return false;">即将上架 App Store</a>
  </div>
</section>
<section class="screenshots">
  <div class="container">
    <h2>应用预览</h2>
    <div class="screenshot-grid">
      <div class="screenshot-item"><div class="placeholder">截图 1<br>（请替换）</div></div>
      <div class="screenshot-item"><div class="placeholder">截图 2<br>（请替换）</div></div>
      <div class="screenshot-item"><div class="placeholder">截图 3<br>（请替换）</div></div>
    </div>
  </div>
</section>
<section class="features">
  <div class="container">
    <h2>功能介绍</h2>
    <div class="feature-list">
      <div class="feature-item">
        <div class="icon">📝</div>
        <h3>快速记录</h3>
        <p>简洁的编辑界面，随时随地捕捉灵感</p>
      </div>
      <div class="feature-item">
        <div class="icon">🏷️</div>
        <h3>智能标签</h3>
        <p>自动识别关键词，轻松分类管理</p>
      </div>
      <div class="feature-item">
        <div class="icon">🔗</div>
        <h3>多端同步</h3>
        <p>iCloud 同步，iPhone / iPad 随时访问</p>
      </div>
    </div>
  </div>
</section>
<footer>
  <p>
    <a href="/privacy">隐私政策</a>
    <a href="/terms">服务条款</a>
  </p>
  <p>&copy; 2026 MarkPie. All rights reserved.</p>
</footer>
</body>
</html>
